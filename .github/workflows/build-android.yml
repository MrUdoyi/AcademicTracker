name: Build Android App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      # We run the build to generate the web assets
      - name: Build Web
        run: npm run build

      # We sync the web assets to the android folder
      - name: Sync Capacitor
        run: npx cap sync

      # We build the actual APK using GitHub's Android tools
      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      # We upload the finished APK so you can download it
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk