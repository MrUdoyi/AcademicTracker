name: Build Android App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Install Node 22 (Required for Capacitor 7+)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2. Install Java 21 (Required for latest Android Gradle Plugin)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 3. Fix Permissions (Crucial for Windows users!)
      # This prevents the "gradlew: Permission denied" error
      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: npm install

      - name: Build Web
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync

      # 4. Build the APK
      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      # 5. Upload the Result
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk