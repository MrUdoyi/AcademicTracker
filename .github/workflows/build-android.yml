name: Build Android App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Updated to v4
      - uses: actions/checkout@v4

      # Updated to v4 and Node 20 (current standard)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Updated to v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Web
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      # FIXED: Updated to v4
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk